plugins {
    id 'bdk.java-common-conventions'
}

description = 'Symphony Java BDK Examples - Core'

dependencies {

    implementation project(':symphony-bdk-core')

    runtimeOnly project(':symphony-bdk-template:symphony-bdk-template-freemarker')
    runtimeOnly project(':symphony-bdk-http:symphony-bdk-http-jersey2')

    // import the extension
    implementation project(':symphony-bdk-extensions:symphony-group-extension')

    // logging
    implementation 'org.slf4j:slf4j-api'
    runtimeOnly 'ch.qos.logback:logback-classic'
    // 'dcover create --preflight' picks the wrong version of mockito and junit-jupiter-engine here so they've been
    // manually set to the  correct version
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.10.1")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")
    testImplementation("org.springframework:spring-test:5.3.8")
    compileOnly("com.diffblue.cover:cover-annotations:1.9.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.9.0")
}
