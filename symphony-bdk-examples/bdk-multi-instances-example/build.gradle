plugins {
    id 'bdk.java-common-conventions'
}

description = 'How to run multiple bot instances in //'

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation project(':symphony-bdk-core')
    implementation 'org.slf4j:slf4j-api'

    implementation 'com.hazelcast:hazelcast:5.3.6'

    runtimeOnly 'ch.qos.logback:logback-classic'
    // 'dcover create --preflight' picks the wrong version of mockito and junit-jupiter-engine here so they've been
    // manually set to the  correct version
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.10.1")
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.11.0")
    testImplementation("org.springframework:spring-test:5.3.8")
    compileOnly("com.diffblue.cover:cover-annotations:1.7.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.7.0")
}
