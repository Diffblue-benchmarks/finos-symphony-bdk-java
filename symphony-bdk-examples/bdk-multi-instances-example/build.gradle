plugins {
    id 'bdk.java-common-conventions'
}

description = 'How to run multiple bot instances in //'

dependencies {
    compileOnly 'org.projectlombok:lombok'
    annotationProcessor 'org.projectlombok:lombok'

    implementation project(':symphony-bdk-core')
    implementation 'org.slf4j:slf4j-api'

    implementation 'com.hazelcast:hazelcast:5.3.6'

    runtimeOnly 'ch.qos.logback:logback-classic'
    compileOnly("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.13.4")
    testImplementation 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation("org.mockito:mockito-core:5.19.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.19.0")
}
