plugins {
    id 'bdk.java-common-conventions'
    id 'org.springframework.boot' version "3.2.2"
}

description = 'Symphony Java BDK Examples for the SpringBoot integration'

dependencies {

    implementation project(':symphony-bdk-spring:symphony-bdk-app-spring-boot-starter')
    implementation 'org.springframework.boot:spring-boot-starter-security'
    compileOnly("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("org.junit.jupiter:junit-jupiter-engine:5.10.5")
    testImplementation 'org.junit.platform:junit-platform-launcher:1.13.4'
    testImplementation("org.mockito:mockito-core:5.11.0")
    testImplementation("org.springframework:spring-test:6.1.15")
    testImplementation("org.springframework.boot:spring-boot-test:3.3.6")
    testImplementation("org.mockito:mockito-core:5.19.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.19.0")
    testImplementation("org.hamcrest:hamcrest:3.0")
}
