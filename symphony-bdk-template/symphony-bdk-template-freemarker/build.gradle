plugins {
    id 'bdk.java-library-conventions'
    id 'bdk.java-publish-conventions'
}

description = 'Symphony Java BDK Template Freemarker Module'

dependencies {
    api project(':symphony-bdk-template:symphony-bdk-template-api')

    implementation 'org.apiguardian:apiguardian-api'
    implementation 'org.freemarker:freemarker'
    implementation 'commons-io:commons-io'

    testImplementation 'org.junit.jupiter:junit-jupiter'
    testImplementation 'org.junit.platform:junit-platform-launcher:1.13.4'
    compileOnly("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("com.diffblue.cover:cover-annotations:1.6.0")
    testImplementation("org.mockito:mockito-core:5.19.0")
    testImplementation("org.mockito:mockito-junit-jupiter:5.19.0")
}

